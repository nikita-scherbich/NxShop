<p-splitter
  [minSizes]="[sidebarMinSize(), contentMinSize()]"
  [panelSizes]="panelSizes()"
  (onResizeEnd)="onSidebarResize($event)"
  class="splitter"
>
  <ng-template #panel>
    <app-sidebar class="sidebar"></app-sidebar>
  </ng-template>
  <ng-template #panel>
    <main class="main">
      <app-header class="header"></app-header>

      <section class="body">
        <router-outlet></router-outlet>
      </section>
    </main>
  </ng-template>
</p-splitter>
